<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ironic Directorate - Prototype</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { background:#111; color:#ddd; font-family:monospace; margin:0; display:flex; gap:12px; }
    #game { image-rendering: pixelated; width: 768px; height: 576px; }
    #sidebar { width:360px; padding:12px; box-sizing:border-box; background:#0b0b0b; border-left:2px solid #222;}
    h1{font-size:16px;margin:0 0 8px 0}
    button{background:#222;color:#fff;border:1px solid #444;padding:6px 8px;margin:6px 0; cursor:pointer}
    .stat{margin:6px 0}
    .choice { display:block; margin:6px 0; text-align:left; }
    .mini-wrap { margin-top:10px; border-top:1px solid #222; padding-top:8px; }
  </style>
</head>
<body>
  <canvas id="game" width="512" height="384"></canvas>
  <div id="sidebar">
    <h1>The Directorate: Absurd Regime Simulator (Prototype)</h1>
    <div id="stats"></div>
    <div id="event"></div>
    <div id="minigame" class="mini-wrap"></div>
    <button id="nextDay">Advance Day</button>
    <p style="font-size:11px;color:#999">This is a fictional, parody game about authoritarian absurdity. No real-world references used.</p>
    <div style="margin-top:8px;font-size:12px;color:#bbb">
      Quick controls: click map for espionage tiles during mini-game, press Space during rallies.
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
